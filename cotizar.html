<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizar Seguro - Myriam Navarro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f5f7fa;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 0;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background-color: white;
      position: relative;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Barra Superior con Botón de Regreso */
    .header-bar {
      background-color: #0067b1;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .btn-back {
      color: white;
      font-size: 18px;
      text-decoration: none;
      transition: transform 0.2s;
    }

    .btn-back:hover {
      transform: translateX(-3px);
    }

    .header-bar h1 {
      font-size: 16px;
      font-weight: 700;
    }

    /* Sección de Formulario */
    .form-section {
      padding: 25px 20px 30px 20px;
    }

    .form-title {
      font-size: 20px;
      font-weight: 700;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 6px;
    }

    .form-subtitle {
      font-size: 12px;
      color: #7f8c8d;
      text-align: center;
      margin-bottom: 22px;
      line-height: 1.4;
    }

    /* Campos y Grids */
    .form-group {
      margin-bottom: 14px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-control {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      color: #334155;
      background-color: #f8fafc;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      border-color: #0067b1;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 103, 177, 0.15);
    }

    select.form-control {
      cursor: pointer;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 70px;
    }

    /* Secciones Dinámicas */
    .dynamic-section {
      display: none;
      animation: fadeIn 0.3s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Checkbox Términos */
    .terms-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #64748b;
      margin: 16px 0 20px 0;
    }

    .terms-box a {
      color: #0067b1;
      text-decoration: underline;
    }

    /* Botón de Enviar (Estilo Naranja Cálido de la Imagen) */
    .btn-submit {
      width: 100%;
      padding: 13px;
      background-color: #f59e0b;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(245, 158, 11, 0.3);
      transition: background 0.2s, transform 0.2s;
    }

    .btn-submit:hover {
      background-color: #d97706;
      transform: translateY(-1px);
    }

    /* Nav Bar Inferior de Redes */
    .bottom-social-nav {
      background-color: #0067b1;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 14px 0;
      width: 100%;
      margin-top: auto;
    }

    .bottom-social-nav a {
      color: white;
      font-size: 20px;
      text-decoration: none;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .bottom-social-nav a:hover {
      color: #e0f2fe;
      transform: scale(1.2);
    }

  
      .alert-success {
        display: none;
        background-color: #d4edda;
        color: #155724;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        font-weight: 600;
        font-size: 14px;
        border: 1px solid #c3e6cb;
      }
      .btn-submit:disabled {
        background-color: #95a5a6;
        cursor: not-allowed;
      }
      .dynamic-section {
        background: #f8fbff;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 15px;
        border: 1px dashed #0067b1;
      }
    
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Header con regreso -->
    <div class="header-bar">
      <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i></a>
      <h1>Regresar a Perfil</h1>
    </div>

    

    <!-- Formulario de Cotización -->
    <div class="form-section">
      <h2 class="form-title">Solicita una cotización</h2>
      <p class="form-subtitle">Un asesor especializado se pondrá en contacto contigo para entender tu operación y ofrecerte la mejor solución.</p>
      
      <!-- Cuadro de mensaje exitoso (Oculto por defecto) -->
      <div id="alertaExito" class="alert-success">
        <i class="fas fa-check-circle"></i> ¡Mensaje enviado con éxito! En breve te contactaremos.
      </div>

      <form id="cotizarForm">
        
        <!-- Desactiva el captcha de FormSubmit -->
        <input type="hidden" name="_captcha" value="false">

        <!-- ================= FORMULARIO BASE (Arriba) ================= -->
        <div class="form-group form-row">
          <input type="text" name="Nombre" class="form-control" placeholder="Nombre completo *" required>
          <input type="email" name="Correo" class="form-control" placeholder="Email (correo@ejemplo.com) *" required>
        </div>

        <div class="form-group form-row">
          <input type="tel" name="Telefono" class="form-control" placeholder="Teléfono (10 dígitos) *" pattern="[0-9]{10}" required>
          <input type="text" name="Codigo_Postal" class="form-control" placeholder="Código postal *" required>
        </div>

        <!-- SELECCIÓN DE SERVICIO -->
        <div class="form-group">
          <select id="tipoServicio" name="Servicio_Deseado" class="form-control" onchange="toggleFormFields()" required>
            <option value="" disabled selected>Tipo de servicio *</option>
            <option value="auto">Seguro de auto, camión o tracto camión</option>
            <option value="vida">Gastos Médicos, Seguro de vida</option>
            <option value="vivienda">Seguro de vivienda</option>
            <option value="empresarial">Empresarial</option>
          </select>
        </div>

        <!-- ================= CAMPOS DINÁMICOS ================= -->
        
        <!-- IF: Seguro de auto, camión o tracto camión -->
        <div id="camposAuto" class="dynamic-section" style="display: none;">
          <div class="form-group form-row">
            <input type="text" name="Vehiculo_Marca" class="form-control" placeholder="Marca">
            <input type="text" name="Vehiculo_Modelo" class="form-control" placeholder="Modelo">
          </div>
          <div class="form-group form-row">
            <input type="text" name="Vehiculo_Version" class="form-control" placeholder="Versión">
            <select name="Vehiculo_Tipo_Tracto" class="form-control">
              <option value="" disabled selected>Tipo de tracto</option>
              <option value="SI">SI</option>
              <option value="NO">NO</option>
              <option value="NO APLICA">NO APLICA</option>
            </select>
          </div>
          <div class="form-group form-row">
            <select name="Vehiculo_Adaptacion" class="form-control">
              <option value="" disabled selected>¿Tiene adaptación?</option>
              <option value="SI">SI</option>
              <option value="NO">NO</option>
              <option value="NO APLICA">NO APLICA</option>
            </select>
            <select name="Vehiculo_Carga" class="form-control">
              <option value="" disabled selected>Tipo de carga</option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="No aplica">No aplica</option>
            </select>
          </div>
        </div>

        <!-- IF: Gastos Medicos, Seguro de vida -->
        <div id="camposVida" class="dynamic-section" style="display: none;">
          <div class="form-group">
            <label style="font-size: 13px; color: #555; margin-bottom: 5px; display: block; text-align: left;">Fecha de nacimiento</label>
            <input type="date" name="Vida_Fecha_Nacimiento" class="form-control">
          </div>
        </div>

        <!-- IF: Seguro de vivienda -->
        <div id="camposVivienda" class="dynamic-section" style="display: none;">
          <div class="form-group form-row">
            <input type="text" name="Vivienda_Ubicacion" class="form-control" placeholder="Ubicación">
            <input type="text" name="Vivienda_Valor" class="form-control" placeholder="Valor aproximado">
          </div>
        </div>

        <!-- IF: Empresarial -->
        <div id="camposEmpresarial" class="dynamic-section" style="display: none;">
          <div class="form-group form-row">
            <input type="text" name="Empresa_Giro" class="form-control" placeholder="Giro de la empresa">
            <input type="number" name="Empresa_Niveles" class="form-control" placeholder="Niveles de construcción">
          </div>
          <div class="form-group">
            <input type="text" name="Empresa_Materiales" class="form-control" placeholder="Materiales de construcción">
          </div>
          <div class="form-group">
            <input type="text" name="Empresa_Contenidos" class="form-control" placeholder="Contenidos">
          </div>
          <div class="form-group">
            <textarea name="Empresa_Descripcion_Contenidos" class="form-control" placeholder="Descripción de contenidos"></textarea>
          </div>
        </div>

        <!-- ================= FORMULARIO BASE (Abajo) ================= -->
        <div class="form-group form-row">
          <input type="number" name="Edad" class="form-control" placeholder="Edad (Ej. 35)">
          <input type="text" name="Genero" class="form-control" placeholder="Género (Ej. Masculino)">
        </div>

        <div class="form-group">
          <textarea name="Informacion_Adicional" class="form-control" placeholder="Información adicional"></textarea>
        </div>

        <!-- Botón Cotizar Ahora -->
        <button type="submit" id="btnEnviar" class="btn-submit">Cotizar ahora</button>

      </form>
    </div>

  <script>
    // Lógica para mostrar/ocultar los campos dinámicos
    function toggleFormFields() {
      const servicio = document.getElementById('tipoServicio').value;
      
      // Lista de todas las secciones dinámicas
      const secciones = ['camposAuto', 'camposVida', 'camposVivienda', 'camposEmpresarial'];
      
      // Ocultar todas las secciones y deshabilitar sus inputs
      secciones.forEach(id => {
        const seccion = document.getElementById(id);
        seccion.style.display = 'none';
        
        const inputs = seccion.querySelectorAll('input, select, textarea');
        inputs.forEach(input => input.disabled = true);
      });

      // Determinar qué sección mostrar
      let idMostrar = '';
      if (servicio === 'auto') idMostrar = 'camposAuto';
      else if (servicio === 'vida') idMostrar = 'camposVida';
      else if (servicio === 'vivienda') idMostrar = 'camposVivienda';
      else if (servicio === 'empresarial') idMostrar = 'camposEmpresarial';

      // Mostrar la sección correspondiente y habilitar sus campos
      if (idMostrar) {
        const seccionMostrar = document.getElementById(idMostrar);
        seccionMostrar.style.display = 'block';
        
        const inputsHabilitar = seccionMostrar.querySelectorAll('input, select, textarea');
        inputsHabilitar.forEach(input => input.disabled = false);
      }
    }

    // Asegurarnos de que al cargar la página los campos ocultos estén deshabilitados
    window.onload = function() {
        toggleFormFields();
    };

    // Lógica AJAX para enviar el correo sin salir de la página
    document.getElementById('cotizarForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Detiene la recarga de la página

      const form = e.target;
      const btnEnviar = document.getElementById('btnEnviar');
      const alertaExito = document.getElementById('alertaExito');
      const formData = new FormData(form);

      // Cambiar estado del botón mientras carga
      btnEnviar.textContent = 'Enviando...';
      btnEnviar.disabled = true;

      // Hacemos la petición a FormSubmit
      fetch('https://formsubmit.co/ajax/myriamnavarroseguros72@gmail.com', {
          method: 'POST',
          body: formData
      })
      .then(response => response.json())
      .then(data => {
          // Mostrar mensaje de éxito
          alertaExito.style.display = 'block';
          
          // Resetear el formulario
          form.reset();
          toggleFormFields(); // Vuelve a ocultar las secciones dinámicas
          
          // Restaurar botón
          btnEnviar.textContent = 'Cotizar ahora';
          btnEnviar.disabled = false;

          // Ocultar la alerta después de 6 segundos
          setTimeout(() => {
              alertaExito.style.display = 'none';
          }, 6000);
      })
      .catch(error => {
          console.error('Error:', error);
          alert('Hubo un error al enviar tu cotización. Por favor, intenta nuevamente.');
          btnEnviar.textContent = 'Cotizar ahora';
          btnEnviar.disabled = false;
      });
    });
  </script>
</body>
</html>
